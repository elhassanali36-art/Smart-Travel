services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smarttravel
      POSTGRES_PASSWORD: smarttravel
      POSTGRES_DB: smarttravel
    ports:
      - "5432:5432"
    volumes:
      - smart_travel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U smarttravel -d smarttravel"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  smart_travel_pg:
